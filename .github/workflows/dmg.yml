name: Build DMG
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build app and DMG
        run: ./scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TinyNotch-dmg
          path: build/*.dmg
          if-no-files-found: error
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dmg-${{ github.run_number }}
          name: TinyNotch DMG build ${{ github.run_number }}
          files: build/*.dmg
